[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmaps-scraper"
version = "0.1.0"
description = "Official Python client for GMaps Lead Finder Agent HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GMaps Lead Finder", email = "support@gmapsleadfinder.com" }]
keywords = ["google-maps", "scraper", "leads", "gmapsleadfinder", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://gmapsleadfinder.com"
Documentation = "https://gmapsleadfinder.com/docs/api"
Repository = "https://github.com/google-maps-lead-scraper/google-maps-scraper"

[project.scripts]
gmaps-scraper = "gmaps_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
