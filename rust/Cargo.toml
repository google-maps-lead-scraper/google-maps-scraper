[package]
name = "google-maps-scraper-sdk"
version = "0.1.2"
edition = "2021"
rust-version = "1.70"
description = "Google Maps Scraper / Extractor / Lead Scraper SDK for the GMaps Lead Finder Agent HTTP API"
license = "MIT"
readme = "README.md"
homepage = "https://gmapsleadfinder.com"
repository = "https://github.com/google-maps-lead-scraper/google-maps-scraper"
documentation = "https://docs.rs/google-maps-scraper-sdk"
keywords = ["google-maps", "scraper", "leads", "extractor", "api"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["target"]

[[bin]]
name = "gmaps-scraper"
path = "src/bin/gmaps-scraper.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
